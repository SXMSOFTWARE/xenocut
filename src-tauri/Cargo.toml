[package]
name = "xenocut"
version = "0.7.0"
description = "XenoCut, a lightweight cross-platform video editor"
authors = ["XenoCut"]
edition = "2024"

[lib]
name = "xenocut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ndarray = "0.17"
hound = "3"
rustfft = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = "0.10"
tauri-plugin-fs = "2"
candle-core = "0.11"
candle-nn = "0.11"
candle-transformers = "0.11"
zip = { version = "2", default-features = false, features = ["deflate"] }

# ONNX Runtime: desktop links the prebuilt binaries; Android loads libonnxruntime.so from the
# onnxruntime-android AAR (gen/android/app/build.gradle.kts) at run time.
[target.'cfg(not(target_os = "android"))'.dependencies]
ort = "=2.0.0-rc.15"

[target.'cfg(target_os = "android")'.dependencies]
ort = { version = "=2.0.0-rc.15", default-features = false, features = ["std", "ndarray", "load-dynamic"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
