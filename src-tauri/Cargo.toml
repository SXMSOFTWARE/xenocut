[package]
name = "xenocut"
version = "0.1.0"
description = "XenoCut, a lightweight cross-platform video editor"
authors = ["XenoCut"]
edition = "2024"

[lib]
name = "xenocut_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ort = "=2.0.0-rc.15"
ndarray = "0.17"
hound = "3"
rustfft = "6"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "blocking"] }
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
