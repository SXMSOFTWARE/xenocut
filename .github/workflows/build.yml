name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  bundle:
    name: ${{ matrix.triple }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
            bundles: appimage,deb
          - os: windows-latest
            triple: x86_64-pc-windows-msvc
            bundles: nsis,msi
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - name: Linux webview and bundler packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libayatana-appindicator3-dev \
            patchelf \
            libssl-dev \
            libxdo-dev \
            file \
            gstreamer1.0-plugins-base \
            gstreamer1.0-plugins-good \
            gstreamer1.0-plugins-bad \
            gstreamer1.0-libav \
            gstreamer1.0-tools
          # The AppImage bundles the runner's GStreamer plugins (bundleMediaFramework). gst-libav and
          # plugins-good/bad give the preview native H.264/AAC/HEVC decoding (avdec_*, qtdemux,
          # h264parse); the app's WebM preview copy stays as the fallback for anything else.

      - name: Check the GStreamer decoders that get bundled
        if: runner.os == 'Linux'
        run: |
          for el in avdec_h264 avdec_aac qtdemux h264parse matroskademux vp8dec opusdec; do
            gst-inspect-1.0 "$el" > /dev/null || { echo "missing GStreamer element $el"; exit 1; }
          done

      - name: Install dependencies
        run: npm ci

      - name: Fetch the FFmpeg sidecar
        shell: bash
        run: bash scripts/fetch-ffmpeg.sh "${{ matrix.triple }}"

      - name: Bundle
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPIMAGE_EXTRACT_AND_RUN: "1"
        with:
          uploadWorkflowArtifacts: true
          args: --bundles ${{ matrix.bundles }}
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
          releaseName: ${{ github.ref_type == 'tag' && format('XenoCut {0}', github.ref_name) || '' }}
          releaseBody: "Installers built from this tag. Linux is an AppImage and a .deb. Windows is an NSIS .exe and an MSI."
          releaseDraft: false
          prerelease: false
